name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: .
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  test_linux_wheels:
    name: Test Linux wheel (Python ${{ matrix.python }})
    needs: build_wheels
    runs-on: ubuntu-24.04  # glibc 2.39, matching the manylinux_2_39 tag
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse/

      - name: Install wheel
        # This version exists only in wheelhouse/; dependencies come from PyPI.
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          pip install --find-links wheelhouse --only-binary=imret "imret==$VERSION" pytest

      - name: Tests
        run: pytest bindings/python/tests -q

      - name: Bundled FAISS has hardware popcount
        run: python scripts/check_wheel_simd.py

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, test_linux_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/imret
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
