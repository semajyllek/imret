name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Test against the same libraries the release wheels use (release.yml):
# FAISS 1.14.3 and OpenCV 4. Distro FAISS is too old (Ubuntu 22.04 ships 1.7.2,
# without per-call SearchParametersIVF), and Homebrew's `opencv` is now 5.x,
# which dropped features2d (ORB).
env:
  FAISS_VERSION: v1.14.3

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libopenblas-dev liblapack-dev

      - name: Cache FAISS (Linux)
        if: runner.os == 'Linux'
        id: faiss-cache
        uses: actions/cache@v4
        with:
          path: ~/faiss
          key: faiss-${{ env.FAISS_VERSION }}-${{ matrix.os }}

      - name: Build FAISS (Linux)
        if: runner.os == 'Linux' && steps.faiss-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$FAISS_VERSION" https://github.com/facebookresearch/faiss.git /tmp/faiss
          cmake -S /tmp/faiss -B /tmp/faiss/build \
            -DFAISS_ENABLE_GPU=OFF -DFAISS_ENABLE_PYTHON=OFF -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/faiss"
          cmake --build /tmp/faiss/build --target faiss -j"$(nproc)"
          cmake --install /tmp/faiss/build

      - name: Use FAISS (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CMAKE_PREFIX_PATH=$HOME/faiss" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/faiss/lib:$HOME/faiss/lib64" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install opencv@4 faiss libomp
          echo "CMAKE_PREFIX_PATH=$(brew --prefix opencv@4)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
